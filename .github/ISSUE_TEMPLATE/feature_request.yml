name: Feature Request
description: Propose a new feature or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the feature and the problem it solves.

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What limitation or gap are you hitting?
      placeholder: Currently I have to do X manually because...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would the ideal behaviour look like?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Laravel app / Livewire
        - MCP server / automation
        - Frontend / Tailwind / Vite
        - Electron desktop
        - CI / CD / workflows
        - Containerisation / deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you looked at.
    validations:
      required: false
