# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

# Dependabot configuration for managing dependencies in the project
#
# Updates within each ecosystem are grouped so a week's bumps arrive as one
# PR per ecosystem/directory rather than a flood of separate ones — matches
# php-security-update.yml's own weekly cadence and keeps review load down.
version: 2
updates:
  # Update PHP dependencies — flux-pro is a private Satis package requiring
  # COMPOSER_AUTH; ignore it so Dependabot can still update public packages.
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "livewire/flux-pro"
    groups:
      composer:
        patterns: ["*"]

  # Update Node.js dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns: ["*"]

  # Update Node.js dependencies in mcp-server
  - package-ecosystem: "npm"
    directory: "/mcp-server"
    schedule:
      interval: "weekly"
    groups:
      npm-mcp-server:
        patterns: ["*"]

  # Update GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
