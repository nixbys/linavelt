name: publish-containers

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish-${{ matrix.image.name }}
    runs-on: ubuntu-latest
    # Needed for COMPOSER_AUTH: the app image's Containerfile fetches the
    # private livewire/flux-pro package and expects an auth.json at build time.
    environment: Testing
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: app
            context: .
            dockerfile: Containerfile
            image_name: linavelt-app
          - name: mcp
            context: ./mcp-server
            dockerfile: Containerfile
            image_name: linavelt-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write composer auth for private Flux Pro package
        if: matrix.image.name == 'app'
        run: |
          printf '%s' "$COMPOSER_AUTH" > auth.json
          chmod 600 auth.json
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}

      - name: Derive tags
        id: tags
        shell: bash
        run: |
          IMAGE_REF="ghcr.io/${{ github.repository_owner }}/${{ matrix.image.image_name }}"
          SHA_TAG="${IMAGE_REF}:sha-${GITHUB_SHA::7}"
          TAGS="${IMAGE_REF}:latest"$'\n'"${SHA_TAG}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAGS="${IMAGE_REF}:${GITHUB_REF_NAME}"$'\n'"${TAGS}"
          fi
          {
            echo 'tags<<EOF'
            printf '%s\n' "$TAGS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image.name }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.context }}/${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Linavelt ${{ matrix.image.name }}

      - name: Remove composer auth from runner
        if: always() && matrix.image.name == 'app'
        run: rm -f auth.json
