name: linter

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    environment: Testing
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install PHP Dependencies
        id: composer_install
        run: |
          if composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Composer install failed (likely private package auth); skipping PHP quality steps."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install JS Dependencies
        run: npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Check and Update Composer Dependencies
        if: steps.composer_install.outputs.ok == 'true'
        run: |
          composer validate
          composer install --no-interaction

      - name: Run Pint
        if: steps.composer_install.outputs.ok == 'true'
        run: vendor/bin/pint

