# Supply-chain review
#
# Purpose: defend against a pull request that adds (or bumps) a dependency
# to a version with a known vulnerability or a disallowed license. Runs on
# every PR and diffs the dependency graph before/after the change across all
# ecosystems this repo uses (composer, npm in both / and /mcp-server) — the
# action reads GitHub's dependency graph, so no per-ecosystem configuration
# is needed here. Blocks the merge on any newly introduced moderate-or-worse
# advisory; existing/pre-existing advisories in already-shipped dependencies
# are handled separately by php-security-update.yml (composer) and Dependabot
# (npm/github-actions), not by this PR gate.

name: Dependency review

on:
  pull_request:
  workflow_dispatch:

# Default-deny token; the job grants only read access.
permissions: {}

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review (PR gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Fail the PR on any newly introduced moderate-or-worse advisory.
          fail-on-severity: moderate
          # livewire/flux-pro is a private Satis package (composer.fluxui.dev)
          # that GitHub's dependency graph cannot resolve licensing/advisory
          # data for; deny-listing it here would break every PR that touches
          # composer.lock, so it is left out of any license/allow-list scope.
          comment-summary-in-pr: on-failure
